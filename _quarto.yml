project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - cards.qmd
    - explore.qmd
    - methods.qmd
    - about.qmd
    - story.qmd
    - stocks/*.qmd
  resources:
    - .nojekyll
    - reports/output/*.pdf
    - data/processed/*.csv
    - figures/*.png
    - images/motif.svg

website:
  title: "BC fish stock status"
  favicon: images/favicon.png
  site-url: https://emmabranch.github.io/bc-fish-stock-status/
  repo-url: https://github.com/emmabranch/bc-fish-stock-status
  navbar:
    logo: images/motif.svg
    logo-alt: ""
    left:
      - href: index.qmd
        text: Map
      - href: cards.qmd
        text: Stock cards
      - href: explore.qmd
        text: Explore
      - href: story.qmd
        text: Story
      - href: methods.qmd
        text: Methods and data
      - href: about.qmd
        text: About
    right:
      - icon: github
        href: https://github.com/emmabranch/bc-fish-stock-status
  page-footer:
    center: "Exploratory personal project by Emma Branch. Not an official assessment and not a seafood recommendation."

format:
  html:
    theme: [flatly, brand, brand.scss, theme.scss]
    css: cards.css
    include-after-body: footer.html
    toc: false

knitr:
  opts_chunk:
    dev: "ragg_png"
    fig.retina: 3

execute:
  echo: false
  warning: false
  message: false
  freeze: auto
